name: Mobile Native Checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Verify OTA trust key
        run: printf '%s  %s\n' 'ecdfe83ab9deee3bb0c74af3bc2bceeca90a5495f7a5e910f857a8fad7e36b97' '.capgo_key_v2.pub' | sha256sum --check --strict
      - run: npm run test:run
      - run: npm run lint
      - run: npm run build
      - run: npm run updates:test
      - run: npm run updates:build

  android-debug:
    needs: web-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run mobile:build
      - run: npx cap sync android
      - name: Verify generated Android OTA trust key
        run: node --input-type=module -e "import fs from 'node:fs'; const expected=fs.readFileSync('.capgo_key_v2.pub','utf8').trim(); const generated=JSON.parse(fs.readFileSync('android/app/src/main/assets/capacitor.config.json','utf8')); if(generated.plugins?.CapacitorUpdater?.publicKey?.trim()!==expected) throw new Error('Android OTA trust key mismatch');"
      - name: Build unsigned Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: logbook-companion-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    needs: web-checks
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run mobile:build
      - run: npx cap sync ios
      - name: Verify generated iOS OTA trust key
        run: node --input-type=module -e "import fs from 'node:fs'; const expected=fs.readFileSync('.capgo_key_v2.pub','utf8').trim(); const generated=JSON.parse(fs.readFileSync('ios/App/App/capacitor.config.json','utf8')); if(generated.plugins?.CapacitorUpdater?.publicKey?.trim()!==expected) throw new Error('iOS OTA trust key mismatch');"
      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install
      - name: Build unsigned iOS simulator app
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
