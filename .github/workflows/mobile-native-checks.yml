name: Mobile Native Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [staging]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'src/components/Layout.tsx'
      - 'src/components/MobileBottomNavigation*.tsx'
      - 'src/pages/Dashboard.tsx'
      - 'src/pages/CompletedWorkoutEntry*.tsx'
      - 'src/pages/mobileAthleteCore.test.ts'
      - 'src/pages/WorkoutDetail.tsx'
      - 'src/pages/TrainingBlock.tsx'
      - 'src/pages/TemplateLibrary.tsx'
      - 'src/pages/TemplateDetail.tsx'
      - 'src/pages/mobileAthleteDetail.test.ts'
      - 'src/pages/Analytics.tsx'
      - 'src/pages/Sync.tsx'
      - 'src/pages/DevelopmentConcept2.tsx'
      - 'src/pages/Preferences.tsx'
      - 'src/pages/WorkoutComparison.tsx'
      - 'src/pages/mobileAthleteOperations.test.ts'
      - 'src/pages/coaching/CoachDashboard.tsx'
      - 'src/pages/coaching/CoachingSchedule.tsx'
      - 'src/pages/coaching/CoachingRoster.tsx'
      - 'src/pages/coaching/CoachingAthleteDetail.tsx'
      - 'src/pages/mobileCoachingCore.test.ts'
      - 'src/pages/coaching/CoachingAssignments.tsx'
      - 'src/pages/coaching/AssignmentResults.tsx'
      - 'src/pages/coaching/CoachingBoatings.tsx'
      - 'src/pages/coaching/TeamAnalytics.tsx'
      - 'src/pages/coaching/CoachingSettings.tsx'
      - 'src/pages/coaching/TeamSetup.tsx'
      - 'src/pages/coaching/RequestCoachingAccess.tsx'
      - 'src/pages/team/*.tsx'
      - 'src/pages/mobileTeamComplete.test.ts'
      - 'src/pages/PM5Connection.tsx'
      - 'src/services/pm5Capture*.ts'
      - 'src/services/pm5DirectService.ts'
      - 'src/services/nativeNavigation*.ts'
      - 'src/services/nativeConfig.test.ts'
      - 'src/components/NativeAppBridge.tsx'
      - 'src/auth/AuthContext.tsx'
      - 'src/pages/AuthCallback.tsx'
      - 'scripts/android_m5_smoke.py'
      - 'src/types/ergSession.types.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-native-checks.yml'

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run lint
      - run: npm run build

  android-debug:
    needs: web-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build unsigned Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: logbook-companion-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    needs: web-checks
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install
      - name: Build unsigned iOS simulator app
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  android-installed-smoke:
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: logbook-companion-android-debug-${{ github.sha }}
          path: artifacts
      - name: Exercise installed Android shell
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/android_m5_smoke.py
