name: iOS TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      archive_run_id:
        description: Successful iOS Beta Archive run ID
        required: true
        type: string
      expected_build:
        description: Exact native build number from the archive metadata
        required: true
        type: string
      confirm_upload:
        description: Upload this verified staging build to App Store Connect (not public release)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main' && inputs.confirm_upload
    runs-on: macos-26
    environment: Production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Verify and download the exact archive artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
          EXPECTED_BUILD: ${{ inputs.expected_build }}
        run: |
          set -euo pipefail
          python3 -B .github/scripts/test_testflight_artifact.py
          python3 -B .github/scripts/testflight_artifact.py

      - name: Validate with Apple and upload once
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::Invalid upload Key ID"; exit 1; }
          [[ "$APPLE_API_ISSUER_ID" =~ ^[a-fA-F0-9-]{36}$ ]] || { echo "::error::Invalid Issuer ID"; exit 1; }
          [[ -n "$APPLE_API_KEY_P8" ]] || { echo "::error::Missing upload private key"; exit 1; }
          cd "$RUNNER_TEMP/lc-testflight"
          mkdir -m 700 private_keys
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          trap 'rm -f "private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"' EXIT
          xcrun altool --validate-app --type ios --file LogbookCompanion.ipa \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
          xcrun altool --upload-app --type ios --file LogbookCompanion.ipa \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
          echo "## Apple accepted the upload; processing and internal tester setup remain in App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean upload material
        if: always()
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            rm -f "$RUNNER_TEMP/lc-testflight/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          fi
          rm -f "$RUNNER_TEMP/lc-testflight/LogbookCompanion.ipa" \
            "$RUNNER_TEMP/lc-testflight/build-metadata.json"
